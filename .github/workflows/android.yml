name: Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: [SelfHosted, Windows]
    timeout-minutes: 30
    outputs:
      host-os: ${{ steps.host.outputs.os }}
      host-arch: ${{ steps.host.outputs.arch }}
    steps:
      - name: Report runner platform
        id: host
        shell: powershell
        run: |
          "os=$env:RUNNER_OS" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "arch=$env:RUNNER_ARCH" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Runner platform: $env:RUNNER_OS / $env:RUNNER_ARCH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test release publisher
        run: node --test .github/scripts/publish-releases.test.cjs
        shell: powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat testDebugUnitTest lintDebug assembleDebug
        shell: powershell
      - uses: actions/upload-artifact@v4
        with:
          name: FlipRSS-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  reading-flow:
    needs: build
    # The emulator action supports x64 Linux/macOS, not Windows/ARM hosts.
    if: >-
      needs.build.outputs.host-arch == 'X64' &&
      (needs.build.outputs.host-os == 'Linux' || needs.build.outputs.host-os == 'macOS')
    runs-on: SelfHosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-flow-reports
          path: app/build/reports/androidTests/
